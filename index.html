<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advoka - Legal Connect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">ADVOKA</h1>
      <p class="tagline">Connecting Justice Seekers with Legal Professionals</p>
    </header>
    
    <main>
      <div class="button-container">
        <a href="/victim" class="btn">
          <span class="btn-icon"><i class="fas fa-user-shield"></i></span>
          <span class="btn-text">Victim Portal</span>
        </a>
        
        <a href="/lawyer" class="btn">
          <span class="btn-icon"><i class="fas fa-gavel"></i></span>
          <span class="btn-text">Lawyer Portal</span>
        </a>
        
        <a href="/about" class="btn">
          <span class="btn-icon"><i class="fas fa-info-circle"></i></span>
          <span class="btn-text">About Platform</span>
        </a>
      </div>
    </main>
    
    <footer>
      <p>© 2023 Advoka Legal Services. Desktop access recommended.</p>
    </footer>
  </div>

  <div class="mobile-restriction">
    <i class="fas fa-exclamation-triangle"></i>
    <h2>Desktop Access Required</h2>
    <p>For the best experience, please use a desktop or laptop computer.</p>
  </div>

  <script src="/js/animations.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
