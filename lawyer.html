<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advoka - Lawyer Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">Lawyer Portal</h1>
      <p class="tagline">Register to review cases</p>
    </header>
    
    <main>
      <div class="form-container">
        <form action="/submit-lawyer" method="POST">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="Name" required>
          </div>
          
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="Phone" required 
                   pattern="[0-9]{10}" title="10 digit phone number">
          </div>
          
          <div class="form-group">
            <label for="lawyerID">Lawyer ID *</label>
            <input type="text" id="lawyerID" name="LawyerID" required>
          </div>
          
          <div class="form-group">
            <label for="specialization">Specialization *</label>
            <select id="specialization" name="Specialization" required>
              <option value="">Select specialization</option>
              <option value="Criminal Law">Criminal Law</option>
              <option value="Civil Law">Civil Law</option>
              <option value="Family Law">Family Law</option>
              <option value="Property Law">Property Law</option>
            </select>
          </div>
          
          <button type="submit" class="submit-btn">Register</button>
        </form>
      </div>
    </main>
    
    <footer>
      <p>© 2023 Advoka Legal Services. Verified lawyers only.</p>
    </footer>
  </div>

  <div class="mobile-restriction">
    <i class="fas fa-exclamation-triangle"></i>
    <h2>Desktop Access Required</h2>
    <p>For the best experience, please use a desktop or laptop computer.</p>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
